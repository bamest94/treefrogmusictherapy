<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2E7D5B">
<meta name="description" content="Music Therapy AAC – Augmentative and Alternative Communication board for music therapy sessions. Treefrog Music Therapy.">
<title>Music Therapy AAC · Treefrog Music Therapy</title>
<style>
:root{
  --green:#2E7D5B; --green-dark:#1F5C42; --green-light:#E3F2EA;
  --bg:#F2F5F3; --card:#ffffff; --ink:#26332C; --ink-soft:#5A6B61;
  --radius:16px;
  --tile-min:108px; --tile-font:16px; --sym-size:56px;
  --shadow:0 2px 6px rgba(30,50,40,.10), 0 8px 20px rgba(30,50,40,.06);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Nunito","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
  height:100vh; height:100dvh; /* dvh handles iOS/Android dynamic browser toolbars */
  padding-bottom:env(safe-area-inset-bottom);
  touch-action:manipulation; user-select:none; -webkit-user-select:none;
}
button{font-family:inherit;}

/* ---------- Header ---------- */
header{
  background:linear-gradient(135deg,var(--green) 0%,#3C9B72 100%);
  color:#fff; padding:8px 14px; display:flex; align-items:center; gap:12px;
  flex:0 0 auto; box-shadow:0 2px 8px rgba(0,0,0,.15); z-index:20;
}
header .logo{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;}
header .logo img{width:100%;height:100%;object-fit:contain;}
header h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px;line-height:1.1;}
header h1 small{display:block;font-size:11px;font-weight:600;opacity:.85;}
header .spacer{flex:1;}
.hbtn{
  border:none;background:rgba(255,255,255,.16);color:#fff;border-radius:12px;
  padding:8px 12px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;
  transition:background .15s;
}
.hbtn:active{background:rgba(255,255,255,.32);}
.hbtn svg{width:20px;height:20px;}
#lockBtn.locked{background:rgba(255,255,255,.9);color:var(--green-dark);}

/* ---------- Sentence strip ---------- */
#strip{
  flex:0 0 auto; background:var(--card); margin:10px 12px 6px; border-radius:var(--radius);
  box-shadow:var(--shadow); display:flex; align-items:stretch; gap:8px; padding:8px;
  min-height:86px; z-index:10;
}
#sentence{
  flex:1; display:flex; gap:6px; overflow-x:auto; align-items:center; padding:2px;
  scrollbar-width:thin;
}
#sentence:empty::before{
  content:"Tap symbols to build a sentence…"; color:#A9B7AE; font-size:15px; font-weight:600; padding-left:8px;
}
.stile{
  flex:0 0 auto; width:72px; height:72px; border-radius:12px; border:2px solid #DCE5DF;
  background:#FBFDFC; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1px; cursor:pointer; padding:3px; position:relative; animation:pop .18s ease-out;
}
.stile.speaking{border-color:var(--green); background:var(--green-light); transform:scale(1.06);}
.stile svg,.stile .emoji{width:40px;height:40px;font-size:34px;line-height:1;display:block;}
.stile span{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;max-width:66px;text-overflow:ellipsis;}
@keyframes pop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.stripBtns{display:flex; gap:6px; align-items:center;}
.abtn{
  border:none; border-radius:14px; cursor:pointer; font-weight:800; font-size:14px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  width:76px; height:100%; min-height:70px; color:#fff; transition:transform .1s, filter .1s;
}
.abtn:active{transform:scale(.94); filter:brightness(1.1);}
.abtn svg{width:26px;height:26px;}
#speakBtn{background:var(--green); font-size:15px;}
#speakBtn.speaking{background:#E67E22; animation:pulse 1s infinite;}
@keyframes pulse{50%{filter:brightness(1.15);}}
#backBtn{background:#8FA69A; width:58px;}
#clearBtn{background:#C65B5B; width:58px;}
#clearBtn.confirm{background:#A02020; animation:pulse .6s infinite;}

/* ---------- Main layout ---------- */
#main{flex:1; display:flex; min-height:0; padding:0 12px 10px; gap:10px;}

/* Core word rail */
#core{
  flex:0 0 auto; width:calc(var(--tile-min)*2*.82 + 8px); min-height:0;
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:8px; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  display:grid; grid-template-columns:1fr 1fr;
  gap:6px; align-content:start;
}
#core h3{grid-column:1/-1; margin:2px 4px; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft);}

/* Right side */
#right{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; gap:8px;}
#tabs{
  flex:0 0 auto; display:flex; gap:6px; overflow-x:auto; padding:2px;
  scrollbar-width:thin; -webkit-overflow-scrolling:touch;
}
.tab{
  flex:0 0 auto; border:none; border-radius:14px; padding:8px 14px; font-size:14px; font-weight:800;
  cursor:pointer; background:var(--card); color:var(--ink); box-shadow:var(--shadow);
  border-bottom:4px solid var(--tc,#ccc); display:flex; align-items:center; gap:7px; transition:transform .1s;
}
.tab svg{width:22px;height:22px;}
.tab.active{background:var(--tc); color:#fff; border-bottom-color:rgba(0,0,0,.25);}
.tab:active{transform:scale(.96);}
.tab.addTab{border-bottom-color:#B8C4BD; color:var(--ink-soft); font-size:18px;}

#grid{
  flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:10px; display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--tile-min),1fr));
  gap:8px; align-content:start;
}

/* Word tiles */
.tile{
  position:relative; border-radius:14px; border:2.5px solid var(--wc,#CCC);
  background:var(--wbg,#fff); cursor:pointer; padding:8px 4px 6px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  min-height:calc(var(--tile-min)*.92); transition:transform .08s, box-shadow .08s;
  box-shadow:0 2px 0 rgba(0,0,0,.06);
}
.tile:active{transform:scale(.93);}
.tile.flash{background:var(--wc); }
.tile.flash span{color:#fff;}
.tile svg,.tile .emoji{width:var(--sym-size);height:var(--sym-size);font-size:calc(var(--sym-size)*.82);line-height:1;display:flex;align-items:center;justify-content:center;}
.tile span{font-size:var(--tile-font); font-weight:800; text-align:center; line-height:1.1; word-break:break-word;}
.tile .del{
  position:absolute; top:-8px; right:-8px; width:26px; height:26px; border-radius:50%;
  background:#C65B5B; color:#fff; border:2px solid #fff; font-size:14px; font-weight:900;
  display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:2;
}
.tile.addWord{border-style:dashed; background:#F7FAF8; color:var(--ink-soft);}
.tile.addWord .plus{font-size:34px; font-weight:400; color:#9FB2A7;}
body.locked .del, body.locked .addWord, body.locked .addTab{display:none;}

/* ---------- Footer ---------- */
footer{flex:0 0 auto; text-align:center; font-size:10.5px; color:#93A49A; padding:0 10px 6px;}

/* ---------- Modals ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(20,35,28,.45); display:none;
  align-items:center; justify-content:center; z-index:100; padding:16px;
}
.overlay.open{display:flex;}
.modal{
  background:#fff; border-radius:20px; padding:20px; width:100%; max-width:420px;
  max-height:88vh; max-height:85dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  user-select:text; -webkit-user-select:text;
}
.modal h2{margin:0 0 4px; font-size:19px; color:var(--green-dark);}
.modal p.sub{margin:0 0 14px; font-size:13px; color:var(--ink-soft);}
.modal label{display:block; font-size:13px; font-weight:800; margin:12px 0 5px; color:var(--ink);}
.modal input[type=text], .modal select{
  width:100%; padding:11px 12px; border-radius:12px; border:2px solid #D7E1DA; font-size:16px;
  font-family:inherit; background:#FBFDFC;
}
.modal input[type=range]{width:100%; accent-color:var(--green);}
.rangeRow{display:flex; align-items:center; gap:10px; font-size:13px; font-weight:700; color:var(--ink-soft);}
.rangeRow output{min-width:38px; text-align:right;}
.mrow{display:flex; gap:10px; margin-top:18px;}
.mbtn{flex:1; border:none; border-radius:12px; padding:12px; font-size:15px; font-weight:800; cursor:pointer;}
.mbtn.primary{background:var(--green); color:#fff;}
.mbtn.ghost{background:#EDF2EF; color:var(--ink);}
.mbtn.danger{background:#FBEAEA; color:#A02020;}
.swatches{display:flex; gap:8px; flex-wrap:wrap;}
.swatch{width:38px;height:38px;border-radius:10px;border:3px solid transparent;cursor:pointer;}
.swatch.sel{border-color:var(--ink); transform:scale(1.1);}
.toggleRow{display:flex; align-items:center; justify-content:space-between; margin-top:12px;}
.toggleRow label{margin:0;}
.switch{position:relative; width:52px; height:30px; flex:0 0 auto;}
.switch input{opacity:0; width:0; height:0;}
.slider{position:absolute; inset:0; background:#CBD6CF; border-radius:30px; cursor:pointer; transition:.2s;}
.slider::before{content:""; position:absolute; width:24px; height:24px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked + .slider{background:var(--green);}
.switch input:checked + .slider::before{transform:translateX(22px);}
.sizeBtns{display:flex; gap:8px;}
.sizeBtn{flex:1; border:2px solid #D7E1DA; background:#FBFDFC; border-radius:12px; padding:10px 4px; font-weight:800; font-size:13px; cursor:pointer; color:var(--ink-soft);}
.sizeBtn.sel{border-color:var(--green); background:var(--green-light); color:var(--green-dark);}

/* Symbol picker */
#symPicker{display:grid; grid-template-columns:repeat(auto-fill,minmax(58px,1fr)); gap:6px; max-height:200px; overflow-y:auto; border:2px solid #E2EAE5; border-radius:12px; padding:8px; margin-top:6px;}
#symPicker .pick{border:2px solid transparent; border-radius:10px; background:#F7FAF8; cursor:pointer; padding:5px; display:flex; align-items:center; justify-content:center;}
#symPicker .pick.sel{border-color:var(--green); background:var(--green-light);}
#symPicker .pick svg{width:40px;height:40px;}

/* Toast */
#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--ink); color:#fff; padding:10px 20px; border-radius:30px; font-size:14px; font-weight:700;
  transition:transform .25s; z-index:200; pointer-events:none; max-width:88vw; text-align:center;
}
#toast.show{transform:translateX(-50%) translateY(0);}

/* Narrow screens: core rail collapses to single column */
@media (max-width:760px){
  #core{width:calc(var(--tile-min)*.95 + 16px); grid-template-columns:1fr;}
  header h1{font-size:14px;}
  .abtn{width:60px;}
  #speakBtn{width:66px;}
}
@media (max-width:520px){
  #main{flex-direction:column;}
  #core{width:auto; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); max-height:26vh; flex:0 0 auto;}
  :root{--tile-min:96px; --sym-size:48px; --tile-font:14px;}
  header h1 small{display:none;}
  #strip{margin:8px 8px 4px;}
  #main{padding:0 8px 8px;}
}
/* Short screens (phone landscape): compress chrome so the grid keeps room */
@media (max-height:480px){
  header{padding:4px 10px;}
  header .logo{width:28px;height:28px;}
  #strip{min-height:62px; margin:6px 8px 4px; padding:5px;}
  .abtn{min-height:50px;}
  .stile{width:52px;height:52px;}
  .stile svg,.stile .emoji{width:28px;height:28px;font-size:24px;}
  footer{display:none;}
}
</style>
</head>
<body class="locked">

<header>
  <div class="logo"><img src="https://treefrogmusictherapy.com.au/images/treefrog-logo.png" alt="Treefrog" onerror="this.parentNode.textContent='🐸'"></div>
  <h1>Music Therapy AAC<small>Treefrog Music Therapy</small></h1>
  <div class="spacer"></div>
  <button class="hbtn" id="lockBtn" title="Lock / unlock editing"></button>
  <button class="hbtn" id="settingsBtn" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<div id="strip">
  <div id="sentence" aria-label="Current sentence"></div>
  <div class="stripBtns">
    <button class="abtn" id="backBtn" title="Remove last word">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
    </button>
    <button class="abtn" id="clearBtn" title="Clear sentence">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
    </button>
    <button class="abtn" id="speakBtn" title="Speak the sentence">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>
      Speak
    </button>
  </div>
</div>

<div id="main">
  <div id="core"><h3>Core words</h3></div>
  <div id="right">
    <div id="tabs"></div>
    <div id="grid"></div>
  </div>
</div>

<footer>Built for Treefrog Music Therapy by Bradley Ames-Thomson · Symbols are original artwork · Works offline once loaded</footer>

<!-- Settings modal -->
<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h2>Settings</h2>
    <p class="sub">Changes are saved on this device.</p>

    <label>Voice</label>
    <select id="voiceSel"></select>

    <label>Speech rate</label>
    <div class="rangeRow"><span>🐢</span><input type="range" id="rateRange" min="0.5" max="1.4" step="0.05" value="0.95"><span>🐇</span><output id="rateOut">0.95</output></div>

    <label>Speech pitch</label>
    <div class="rangeRow"><span>Low</span><input type="range" id="pitchRange" min="0.6" max="1.6" step="0.05" value="1"><output id="pitchOut">1.0</output></div>

    <label>Button size</label>
    <div class="sizeBtns">
      <button class="sizeBtn" data-size="s">Small</button>
      <button class="sizeBtn sel" data-size="m">Medium</button>
      <button class="sizeBtn" data-size="l">Large</button>
    </div>

    <div class="toggleRow">
      <label>Speak each word when tapped</label>
      <span class="switch"><input type="checkbox" id="speakOnTap" checked><span class="slider"></span></span>
    </div>
    <div class="toggleRow">
      <label>Auto-clear after speaking</label>
      <span class="switch"><input type="checkbox" id="autoClear"><span class="slider"></span></span>
    </div>

    <div class="mrow">
      <button class="mbtn danger" id="resetBtn">Reset board</button>
      <button class="mbtn primary" id="settingsClose">Done</button>
    </div>
  </div>
</div>

<!-- Add word modal -->
<div class="overlay" id="wordOverlay">
  <div class="modal">
    <h2>Add a word</h2>
    <p class="sub" id="wordModalSub"></p>
    <label>Word or phrase (shown on the button)</label>
    <input type="text" id="wordLabel" maxlength="30" placeholder="e.g. rainbow shaker">
    <label>Spoken text (optional, if different)</label>
    <input type="text" id="wordSpeak" maxlength="60" placeholder="e.g. I want the rainbow shaker">
    <label>Picture — choose a symbol…</label>
    <div id="symPicker"></div>
    <label>…or type an emoji instead</label>
    <input type="text" id="wordEmoji" maxlength="4" placeholder="🎶" style="width:90px; font-size:24px; text-align:center;">
    <div class="mrow">
      <button class="mbtn ghost" id="wordCancel">Cancel</button>
      <button class="mbtn primary" id="wordSave">Save word</button>
    </div>
  </div>
</div>

<!-- Add section modal -->
<div class="overlay" id="secOverlay">
  <div class="modal">
    <h2>Add a section</h2>
    <p class="sub">Create your own category of words.</p>
    <label>Section name</label>
    <input type="text" id="secName" maxlength="24" placeholder="e.g. Sensory">
    <label>Colour</label>
    <div class="swatches" id="secSwatches"></div>
    <div class="mrow">
      <button class="mbtn ghost" id="secCancel">Cancel</button>
      <button class="mbtn primary" id="secSave">Create section</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>

"use strict";
/* ================= SYMBOLS =================
   Original pictographic artwork drawn as inline SVG (viewBox 0 0 100 100),
   styled after clean AAC symbol conventions. */
function ST(over){const d={'stroke':'#33413A','stroke-width':'4.5','stroke-linecap':'round','stroke-linejoin':'round'};Object.assign(d,over||{});return Object.entries(d).map(([k,v])=>k+'="'+v+'"').join(' ');}
const S = ST();
const SKIN='#FFCC80', SKIN2='#D7A06B';
function head(cx,cy,r){return `<circle cx="${cx}" cy="${cy}" r="${r||11}" fill="${SKIN}" ${S}/>`;}
function note(x,y,s,c){s=s||1;c=c||'#33413A';return `<g transform="translate(${x},${y}) scale(${s})"><path d="M0 22 V-2 l14 -4 V18" fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round"/><ellipse cx="-4" cy="22" rx="5.5" ry="4.5" fill="${c}"/><ellipse cx="10" cy="18" rx="5.5" ry="4.5" fill="${c}"/></g>`;}
function arrow(x1,y1,x2,y2,c){c=c||'#E05A4E';const a=Math.atan2(y2-y1,x2-x1),l=10;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="6" stroke-linecap="round"/><path d="M${x2} ${y2} L${x2-l*Math.cos(a-0.45)} ${y2-l*Math.sin(a-0.45)} M${x2} ${y2} L${x2-l*Math.cos(a+0.45)} ${y2-l*Math.sin(a+0.45)}" stroke="${c}" stroke-width="6" stroke-linecap="round"/>`;}
function stick(x,y,shirt,arms){shirt=shirt||'#7EB8E8';arms=arms||'M50 46 L32 60 M50 46 L68 60';
 return `<g transform="translate(${x-50},${y-50})">${head(50,22)}<path d="M50 33 V62" ${ST({'stroke':shirt,'stroke-width':'9'})}/><path d="${arms}" ${S}/><path d="M50 62 L38 88 M50 62 L62 88" ${S}/></g>`;}

const SYMBOLS = {
/* --- core --- */
i:      stick(50,52,'#F6C445')+arrow(16,38,38,44),
you:    stick(56,52,'#F6C445')+arrow(14,70,34,58,'#4A90D9'),
want:   `${head(30,26)}<path d="M30 37 V66 M30 44 L52 34 M30 44 L52 52 M30 66 L20 90 M30 66 L40 90" ${S}/><path d="M72 28 l5 11 12 1-9 8 3 12-11-7-11 7 3-12-9-8 12-1z" fill="#F6C445" ${S}/>`,
more:   `<circle cx="34" cy="62" r="12" fill="#7EB8E8" ${S}/><circle cx="56" cy="66" r="10" fill="#8ECB7F" ${S}/><circle cx="44" cy="44" r="9" fill="#F2A65A" ${S}/><path d="M72 24 v24 M60 36 h24" stroke="#2E7D5B" stroke-width="8" stroke-linecap="round"/>`,
stop:   `<path d="M35 12 h30 l23 23 v30 l-23 23 h-30 l-23-23 v-30 z" fill="#E05A4E" ${S}/><path d="M50 20 v26 M42 24 v22 M58 24 v22 M36 32 q-4 16 4 26 q10 12 24 4 q8-6 4-18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>`,

/* ================= STATE ================= */
const LS_KEY = 'mtaac-v2';
let state = load();
function defaults(){ return {
  settings:{voice:'', rate:0.95, pitch:1, size:'m', speakOnTap:true, autoClear:false, locked:true},
  customWords:{},        // sectionId -> [{l, sp, s|e}]
  removedWords:{},       // sectionId -> [labels]
  customSections:[],     // [{id,name,col,tab,words:[]}]
  removedSections:[],    // [sectionIds]
};}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const d = defaults(); return Object.assign(d, JSON.parse(raw)); }
  }catch(e){}
  return defaults();
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

function allSections(){
  const base = DEFAULT_SECTIONS.filter(s => !state.removedSections.includes(s.id));
  return base.concat(state.customSections);
}
function sectionWords(sec){
  const removed = state.removedWords[sec.id] || [];
  const extra = state.customWords[sec.id] || [];
  return sec.words.filter(w => !removed.includes(w.l)).concat(extra);
}

let sentence = [];       // [{l, sp, s?, e?, col}]
let activeSection = null;
let clearArmed = false, clearTimer = null;

/* ================= DOM helpers ================= */
const $ = id => document.getElementById(id);
const toastEl = $('toast');
let toastTimer;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2200);
}
function visual(w){
  const svg = w.s && symSvg(w.s);
  if(svg) return svg;
  return `<span class="emoji">${w.e || '💬'}</span>`;
}

/* ================= SPEECH ================= */
const synth = window.speechSynthesis;
let voices = [];
function loadVoices(){
  voices = synth ? synth.getVoices() : [];
  const sel = $('voiceSel');
  sel.innerHTML = '';
  if(!voices.length){ sel.innerHTML = '<option>Default voice</option>'; return; }
  const en = voices.filter(v=>v.lang.toLowerCase().startsWith('en'));
  const list = en.length ? en : voices;
  list.forEach(v=>{
    const o = document.createElement('option');
    o.value = v.name; o.textContent = `${v.name} (${v.lang})`;
    sel.appendChild(o);
  });
  if(state.settings.voice && list.some(v=>v.name===state.settings.voice)){
    sel.value = state.settings.voice;
  } else {
    const au = list.find(v=>/en[-_]AU/i.test(v.lang)) || list.find(v=>/karen/i.test(v.name)) || list[0];
    if(au){ sel.value = au.name; state.settings.voice = au.name; }
  }
}
if(synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }

function utter(text){
  if(String(text).trim()==='I') text = 'i'; // some voices read a lone capital I as "capital I"
  const u = new SpeechSynthesisUtterance(text);
  const v = voices.find(v=>v.name===state.settings.voice);
  if(v) u.voice = v;
  u.rate = state.settings.rate; u.pitch = state.settings.pitch;
  return u;
}
function speakText(text){
  if(!synth) return;
  synth.cancel();
  synth.speak(utter(text));
}
function speakSentence(){
  if(!synth || !sentence.length) return;
  synth.cancel();
  const btn = $('speakBtn');
  btn.classList.add('speaking');
  const tiles = [...$('sentence').children];
  sentence.forEach((w,i)=>{
    const u = utter(w.sp || w.l);
    u.onstart = ()=>{ tiles.forEach(t=>t.classList.remove('speaking')); if(tiles[i]) tiles[i].classList.add('speaking'); };
    if(i === sentence.length-1){
      u.onend = u.onerror = ()=>{
        btn.classList.remove('speaking');
        tiles.forEach(t=>t.classList.remove('speaking'));
        if(state.settings.autoClear){ setTimeout(()=>{ sentence=[]; renderSentence(); }, 600); }
      };
    }
    synth.speak(u);
  });
}

/* ================= RENDER ================= */
function renderSentence(){
  const box = $('sentence');
  box.innerHTML = '';
  sentence.forEach((w,i)=>{
    const t = document.createElement('div');
    t.className = 'stile';
    t.style.borderColor = COLORS[w.col]?.c || '#DCE5DF';
    t.innerHTML = `${visual(w)}<span>${esc(w.l)}</span>`;
    t.title = 'Tap to remove';
    t.onclick = ()=>{ sentence.splice(i,1); renderSentence(); };
    box.appendChild(t);
  });
  box.scrollLeft = box.scrollWidth;
}

function makeTile(w, col, sec){
  const t = document.createElement('button');
  t.className = 'tile';
  const c = COLORS[col] || COLORS.orange;
  t.style.setProperty('--wc', c.c);
  t.style.setProperty('--wbg', c.bg);
  t.innerHTML = `${visual(w)}<span>${esc(w.l)}</span>`;
  t.onclick = ()=>{
    if(sentence.length >= 14){ toast('Sentence is full — press Speak or Clear'); return; }
    sentence.push({l:w.l, sp:w.sp, s:w.s, e:w.e, col});
    renderSentence();
    if(state.settings.speakOnTap) speakText(w.sp || w.l);
    t.classList.add('flash'); setTimeout(()=>t.classList.remove('flash'), 180);
  };
  if(sec && !state.settings.locked){
    const del = document.createElement('span');
    del.className = 'del'; del.textContent = '×'; del.title = 'Remove this word';
    del.onclick = (e)=>{
      e.stopPropagation();
      const custom = state.customWords[sec.id] || [];
      const ci = custom.findIndex(x=>x.l===w.l);
      if(ci >= 0){ custom.splice(ci,1); }
      else{ (state.removedWords[sec.id] = state.removedWords[sec.id] || []).push(w.l); }
      save(); renderGrid(); toast(`Removed “${w.l}”`);
    };
    t.appendChild(del);
  }
  return t;
}

function renderCore(){
  const core = $('core');
  core.innerHTML = '<h3>Core words</h3>';
  CORE_WORDS.forEach(w => core.appendChild(makeTile(w, w.col, null)));
}

function renderTabs(){
  const tabs = $('tabs');
  tabs.innerHTML = '';
  const secs = allSections();
  if(!secs.some(s=>s.id===activeSection)) activeSection = secs[0]?.id || null;
  secs.forEach(sec=>{
    const b = document.createElement('button');
    b.className = 'tab' + (sec.id===activeSection ? ' active' : '');
    b.style.setProperty('--tc', COLORS[sec.col]?.c || '#888');
    b.innerHTML = (sec.tab && symSvg(sec.tab) || '') + esc(sec.name);
    b.onclick = ()=>{ activeSection = sec.id; renderTabs(); renderGrid(); };
    tabs.appendChild(b);
  });
  const add = document.createElement('button');
  add.className = 'tab addTab'; add.textContent = '＋ Section'; add.title = 'Add a section';
  add.onclick = openSectionModal;
  tabs.appendChild(add);
}

function renderGrid(){
  const grid = $('grid');
  grid.innerHTML = '';
  const sec = allSections().find(s=>s.id===activeSection);
  if(!sec) return;
  sectionWords(sec).forEach(w => grid.appendChild(makeTile(w, sec.col, sec)));
  if(!state.settings.locked){
    const add = document.createElement('button');
    add.className = 'tile addWord';
    add.innerHTML = `<span class="plus">＋</span><span>Add word</span>`;
    add.onclick = ()=>openWordModal(sec);
    grid.appendChild(add);

    if(state.customSections.some(s=>s.id===sec.id) || !DEFAULT_SECTIONS.some(d=>d.id===sec.id)){
      const del = document.createElement('button');
      del.className = 'tile addWord';
      del.innerHTML = `<span class="plus">🗑</span><span>Delete section</span>`;
      del.onclick = ()=>{
        state.customSections = state.customSections.filter(s=>s.id!==sec.id);
        save(); renderTabs(); renderGrid(); toast(`Deleted “${sec.name}”`);
      };
      grid.appendChild(del);
    }
  }
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ================= STRIP BUTTONS ================= */
$('speakBtn').onclick = speakSentence;
$('backBtn').onclick = ()=>{ sentence.pop(); renderSentence(); };
$('clearBtn').onclick = ()=>{
  if(!sentence.length) return;
  if(clearArmed){
    sentence = []; renderSentence();
    clearArmed = false; $('clearBtn').classList.remove('confirm');
    clearTimeout(clearTimer);
  } else {
    clearArmed = true; $('clearBtn').classList.add('confirm');
    toast('Tap again to clear the sentence');
    clearTimer = setTimeout(()=>{ clearArmed=false; $('clearBtn').classList.remove('confirm'); }, 2500);
  }
};

/* ================= LOCK (tap to toggle, confirm to unlock) ================= */
const lockBtn = $('lockBtn');
function renderLock(){
  const locked = state.settings.locked;
  document.body.classList.toggle('locked', locked);
  lockBtn.classList.toggle('locked', locked);
  lockBtn.innerHTML = locked
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Edit board'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.9-.9"/></svg> Lock board';
}
lockBtn.addEventListener('click', ()=>{
  if(state.settings.locked){
    if(confirm('Unlock editing?\n\nYou will be able to add and remove words and sections. Tap \u201cLock board\u201d again before handing the device to a child.')){
      state.settings.locked = false; save();
      renderLock(); renderGrid(); renderTabs();
      toast('Editing on \u2014 use \u201c\uFF0B Section\u201d or the \u201c\uFF0B Add word\u201d tile in any section');
    }
  } else {
    state.settings.locked = true; save();
    renderLock(); renderGrid(); renderTabs();
    toast('Board locked \u2014 safe to hand over');
  }
});

/* ================= SETTINGS ================= */
const SIZES = {s:{min:'88px',font:'13px',sym:'42px'}, m:{min:'108px',font:'16px',sym:'56px'}, l:{min:'140px',font:'19px',sym:'74px'}};
function applySize(){
  const z = SIZES[state.settings.size] || SIZES.m;
  const r = document.documentElement.style;
  r.setProperty('--tile-min', z.min); r.setProperty('--tile-font', z.font); r.setProperty('--sym-size', z.sym);
  document.querySelectorAll('.sizeBtn').forEach(b=>b.classList.toggle('sel', b.dataset.size===state.settings.size));
}
$('settingsBtn').onclick = ()=>{
  loadVoices();
  $('rateRange').value = state.settings.rate; $('rateOut').textContent = state.settings.rate;
  $('pitchRange').value = state.settings.pitch; $('pitchOut').textContent = Number(state.settings.pitch).toFixed(1);
  $('speakOnTap').checked = state.settings.speakOnTap;
  $('autoClear').checked = state.settings.autoClear;
  $('settingsOverlay').classList.add('open');
};
$('settingsClose').onclick = ()=>{ $('settingsOverlay').classList.remove('open'); save(); };
$('voiceSel').onchange = e=>{ state.settings.voice = e.target.value; speakText('Hello! Let’s make some music.'); };
$('rateRange').oninput = e=>{ state.settings.rate = +e.target.value; $('rateOut').textContent = e.target.value; };
$('rateRange').onchange = ()=>speakText('Hello! Let’s make some music.');
$('pitchRange').oninput = e=>{ state.settings.pitch = +e.target.value; $('pitchOut').textContent = (+e.target.value).toFixed(1); };
$('pitchRange').onchange = ()=>speakText('Hello! Let’s make some music.');
$('speakOnTap').onchange = e=>{ state.settings.speakOnTap = e.target.checked; };
$('autoClear').onchange = e=>{ state.settings.autoClear = e.target.checked; };
document.querySelectorAll('.sizeBtn').forEach(b=>{
  b.onclick = ()=>{ state.settings.size = b.dataset.size; applySize(); save(); };
});
$('resetBtn').onclick = ()=>{
  if(confirm('Reset the board? This removes all custom words and sections on this device.')){
    localStorage.removeItem(LS_KEY);
    state = defaults();
    applySize(); renderLock(); renderCore(); renderTabs(); renderGrid();
    $('settingsOverlay').classList.remove('open');
    toast('Board reset to defaults');
  }
};

/* ================= ADD WORD ================= */
let wordTargetSec = null, pickedSymbol = null;
function openWordModal(sec){
  wordTargetSec = sec; pickedSymbol = null;
  $('wordModalSub').textContent = `Adding to “${sec.name}”`;
  $('wordLabel').value = ''; $('wordSpeak').value = ''; $('wordEmoji').value = '';
  const p = $('symPicker');
  p.innerHTML = '';
  PICKER.forEach(id=>{
    const d = document.createElement('div');
    d.className = 'pick'; d.innerHTML = symSvg(id);
    d.onclick = ()=>{
      document.querySelectorAll('#symPicker .pick').forEach(x=>x.classList.remove('sel'));
      d.classList.add('sel'); pickedSymbol = id; $('wordEmoji').value = '';
    };
    p.appendChild(d);
  });
  $('wordOverlay').classList.add('open');
  setTimeout(()=>$('wordLabel').focus(), 100);
}
$('wordEmoji').oninput = ()=>{
  if($('wordEmoji').value){
    pickedSymbol = null;
    document.querySelectorAll('#symPicker .pick').forEach(x=>x.classList.remove('sel'));
  }
};
$('wordCancel').onclick = ()=>$('wordOverlay').classList.remove('open');
$('wordSave').onclick = ()=>{
  const l = $('wordLabel').value.trim();
  if(!l){ toast('Please enter a word'); return; }
  const w = {l, sp: $('wordSpeak').value.trim() || undefined};
  if(pickedSymbol) w.s = pickedSymbol;
  else w.e = $('wordEmoji').value.trim() || '💬';
  (state.customWords[wordTargetSec.id] = state.customWords[wordTargetSec.id] || []).push(w);
  save(); renderGrid();
  $('wordOverlay').classList.remove('open');
  toast(`Added “${l}”`);
};

/* ================= ADD SECTION ================= */
let pickedCol = 'orange';
function openSectionModal(){
  $('secName').value = '';
  const sw = $('secSwatches');
  sw.innerHTML = '';
  Object.entries(COLORS).forEach(([k,v])=>{
    const d = document.createElement('div');
    d.className = 'swatch' + (k===pickedCol?' sel':'');
    d.style.background = v.c;
    d.onclick = ()=>{ pickedCol = k; document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); };
    sw.appendChild(d);
  });
  $('secOverlay').classList.add('open');
  setTimeout(()=>$('secName').focus(), 100);
}
$('secCancel').onclick = ()=>$('secOverlay').classList.remove('open');
$('secSave').onclick = ()=>{
  const name = $('secName').value.trim();
  if(!name){ toast('Please enter a section name'); return; }
  const id = 'custom-' + Date.now();
  state.customSections.push({id, name, col:pickedCol, tab:'song', words:[]});
  save();
  activeSection = id;
  renderTabs(); renderGrid();
  $('secOverlay').classList.remove('open');
  toast(`Created “${name}” — now add some words`);
};

/* Close overlays by tapping the dark background */
document.querySelectorAll('.overlay').forEach(o=>{
  o.addEventListener('click', e=>{ if(e.target===o) o.classList.remove('open'); });
});

/* Keep screen awake during sessions if supported */
if('wakeLock' in navigator){
  let wl = null;
  const req = async ()=>{ try{ wl = await navigator.wakeLock.request('screen'); }catch(e){} };
  req();
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') req(); });
}

/* ================= INIT ================= */
applySize(); renderLock(); renderCore(); renderTabs(); renderGrid(); renderSentence();


</script>
